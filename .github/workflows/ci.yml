name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Lint (ESLint, check only)
        run: pnpm run lint:check

      - name: Lint web (oxlint + ESLint, check only)
        run: pnpm --filter @classworks/web run lint:check

      - name: Agent docs in sync (AGENTS.md / CLAUDE.md)
        run: pnpm run check:agent-docs

      - name: Format check (Prettier)
        run: pnpm run format:check

  test-web:
    name: Test web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      # 离线系统的回归守护：重试策略 / 心跳 / RMW fail-closed / 暂存 / 跨标签租约 /
      # 后台退避 / SW 更新时序 / 未保存门禁（每项都做过负向验证）
      - name: Test web
        run: pnpm --filter @classworks/web run test

  build-web:
    name: Build web (PWA)
    runs-on: ubuntu-latest
    env:
      VITE_APP_ID: d158067f53627d2b98babe8bffd2fd7d
      VITE_DEFAULT_KV_SERVER: https://kv-service.wuyuan.dev
      VITE_DEFAULT_AUTH_SERVER: https://kv.houlang.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Build web
        run: pnpm --filter @classworks/web run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      - name: Build dashboard
        run: pnpm --filter @classworks/dashboard run build

      - name: Upload dashboard dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          if-no-files-found: error

  build-server:
    name: Build server (prisma generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm

      # 根 `pnpm run build` 会构建全部 apps，此前 CI 只覆盖 web 与 dashboard，
      # 于是 server 构建损坏时 CI 依然是绿的。这里补上覆盖。
      # 注：生成物 apps/server/generated/ 已不入库，本步骤负责重新生成。
      - name: Build server
        run: pnpm --filter @classworks/server run build
